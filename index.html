<!DOCTYPE html>
<html>
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party 🍿</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        header {
            padding: 25px;
        }

        h1 {
            margin: 0;
        }

        #player {

            height: 600px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message {
            color: #aaa;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🍿 Watch Party</h1>
        <p>Watching together</p>
    </header>

    <div id="player">
        <div class="message">
            Video player will go here
        </div>
    </div>

</body>
</html>
